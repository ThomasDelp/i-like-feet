<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J’aime les pieds</title>
<meta name="description" content="Une page avec un fond de pieds volants.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦶</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="feet" aria-hidden="true"></canvas>

  <main>
    <h1>J’aime&nbsp;les&nbsp;pieds</h1>
    <p class="tagline">Dix orteils, zéro regret. Et 100&nbsp;% de talons en vol de plus.</p>

    <p class="cta"><a href="game.html">Jouer : Alexandre &amp; Sabrina 👑</a></p>

    <div class="panel">
      <label>
        <span>Pieds en vol</span>
        <input id="count" type="range" min="4" max="120" value="36">
        <output id="countOut">36</output>
      </label>
      <label>
        <span>Vitesse de vol</span>
        <input id="speed" type="range" min="1" max="40" value="12">
        <output id="speedOut">1.2×</output>
      </label>
      <button id="stomp" type="button">Taper du pied 👣</button>
    </div>

    <p class="hint">Astuce : <kbd>espace</kbd> pour taper du pied, <kbd>P</kbd> pour mettre en pause.</p>
  </main>

  <footer>
    Fait avec du HTML, du CSS et un canvas plein de pieds ·
    <a href="https://github.com/ThomasDelp/i-like-feet">le code</a>
  </footer>

  <script src="feet.js"></script>
</body>
</html>
